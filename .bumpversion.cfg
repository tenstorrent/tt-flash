; Version scheme for the release workflow: X.Y.Z for a release, X.Y.Z-rc.N
; for a release candidate.
;
; The "release" part is what makes candidates work. It is optional, so it
; disappears from the serialised version once it reaches "final", and bumping
; any of major/minor/patch resets it to "rc". That means bumping a part opens a
; candidate, bumping "release" closes it, and bumping "rc" moves to the next
; one. An ordinary release bumps the part and then "release", so it never sees
; a candidate.
;
; current_version is deliberately absent: the workflow reads the version from
; pyproject.toml and passes it with --current-version, so there is only ever
; one source of truth. bump2version writes a current_version line in here as a
; side effect of running; it is not committed.

[bumpversion]
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(\-(?P<release>[a-z]+)\.(?P<rc>\d+))?
serialize =
	{major}.{minor}.{patch}-{release}.{rc}
	{major}.{minor}.{patch}

[bumpversion:part:release]
optional_value = final
first_value = rc
values =
	rc
	final

[bumpversion:part:rc]
first_value = 1

[bumpversion:file:pyproject.toml]
